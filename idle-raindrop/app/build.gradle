plugins { id 'com.android.application' }

// For Play: put the signing key in keystore.properties (storeFile, storePassword, keyAlias, keyPassword).
def keyFile = rootProject.file('keystore.properties')
def keys = new Properties()
if (keyFile.exists()) keyFile.withInputStream { keys.load(it) }

android {
    namespace = 'com.idleraindrop.game'
    compileSdk = 36
    defaultConfig {
        applicationId = 'com.idleraindrop.game'
        minSdk = 28
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    signingConfigs {
        if (keyFile.exists()) {
            release {
                storeFile = rootProject.file(keys['storeFile'])
                storePassword = keys['storePassword']
                keyAlias = keys['keyAlias']
                keyPassword = keys['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keyFile.exists()) signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}
